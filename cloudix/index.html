<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary SEO Tags -->
  <title>Cloudix Soft | Web Development, Mobile Apps & Digital Marketing</title>
  <meta name="title" content="Cloudix Soft | Web Development, Mobile Apps & Digital Marketing" />
  <meta name="description" content="Cloudix Soft provides custom web development, mobile apps, e-commerce solutions, and ethical digital marketing to grow your business. Request a quote!" />

  <!-- Open Graph / Facebook / LinkedIn -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://cloudixsoft.com/" />
  <meta property="og:title" content="Cloudix Soft | Web & Mobile App Development Company" />
  <meta property="og:description" content="Custom web development, mobile apps, e-commerce, and digital marketing services." />
  <meta property="og:image" content="https://cloudixsoft.com/og-image.jpg" />

  <link rel="icon" type="image/png" href="/X.png" />

  <!-- Disable browser scroll restoration -->
  <script>history.scrollRestoration = 'manual';</script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Preload ONLY Above-The-Fold Hero LCP Asset -->
  <link rel="preload" as="image" href="./src/assets/home-bg.webp" fetchpriority="high" />

  <!-- JSON-LD Structured Data for Local/Professional Business -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ProfessionalService",
    "name": "Cloudix Soft",
    "url": "https://cloudixsoft.com/",
    "logo": "https://cloudixsoft.com/logo.png",
    "description": "Cloudix Soft offers custom web development, mobile app creation, e-commerce, and digital marketing services.",
    "priceRange": "$$"
  }
  </script>

  <style>
    /* Fullscreen Loader */
    #logo-loader {
      position: fixed;
      inset: 0;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 1;
      transition: opacity 0.6s ease;
    }

    #logo-loader[hidden] {
      display: none;
    }

    .loader-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .loader-logo {
      width: 250px;
      height: auto;
    }

    .dots {
      display: flex;
      gap: 10px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #769914;
      opacity: 0.3;
      animation: dotPulse 1.4s infinite ease-in-out;
    }

    .dot:nth-child(1) { animation-delay: 0s; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dotPulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
  </style>
</head>

<body>
  <div id="logo-loader" role="status" aria-busy="true">
    <div class="loader-wrapper">
      <img src="/logo.webp" alt="Cloudix Soft Logo" class="loader-logo" />
      <div class="dots">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
