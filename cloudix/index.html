<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloudix Soft</title>
  <link rel="icon" type="image/png" href="/X.png" />

  <style>
    /* 🌥️ Fullscreen Loader */
    #logo-loader {
      position: fixed;
      inset: 0;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.6s ease;
    }

    .loader-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    /* 🧿 Logo */
    .loader-logo {
      width: 200px;
      height: auto;
    }

    /* 🔵 Dots container */
    .dots {
      display: flex;
      gap: 10px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #cfd8dc;
      animation: dotPulse 1.4s infinite ease-in-out;
    }

    .dot:nth-child(1) {
      animation-delay: 0s;
    }
    .dot:nth-child(2) {
      animation-delay: 0.2s;
    }
    .dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes dotPulse {
      0% {
        opacity: 0.3;
        background-color: #cfd8dc;
      }
      50% {
        opacity: 1;
        background-color: #769914; /* primary blue */
      }
      100% {
        opacity: 0.3;
        background-color: #cfd8dc;
      }
    }
  </style>
</head>

<body>
  <!-- Loader -->
  <div id="logo-loader">
    <div class="loader-wrapper">
      <img src="/logo.png" alt="Cloudix Soft Logo" class="loader-logo" />
      <div class="dots">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>
  </div>

  <!-- App root -->
  <div id="root"></div>

  <script>
    window.addEventListener("load", () => {
      const loader = document.getElementById("logo-loader");

      setTimeout(() => {
        loader.style.opacity = "0";
        setTimeout(() => loader.remove(), 600);
      }, 1200);
    });
  </script>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
